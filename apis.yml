description: Red Tricycle (redtri.com) was a digital parenting media company publishing local family
  activity guides, things-to-do listings, product roundups, and lifestyle content for parents across
  major US cities. It was acquired by Tinybeans, and the redtri.com domain now permanently redirects
  (HTTP 301) to tinybeans.com, a family photo-sharing app. Red Tricycle was surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network. Enrichment found no public developer
  API, SDK, developer portal, or machine-readable API surface for either the Red Tricycle or Tinybeans
  consumer property.
